{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<section class="error-page-container">
  <div class="error-card">
    <div class="error-code-badge">{{ code }}</div>
    <h1 class="error-title">We couldn't complete that request</h1>
    <p class="error-message">{{ message }}</p>
    <div class="error-actions">
      <a class="button button-primary button-lg" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M19 12H5m7-7-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Return to Workspace</span>
      </a>
    </div>
  </div>
</section>
{% endblock %}

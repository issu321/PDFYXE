<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="av3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021526" />
      <stop offset="40%" stop-color="#03346E" />
      <stop offset="75%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="av3-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.3" />
    </linearGradient>
    <filter id="av3-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#av3-bg)" />

  <circle cx="250" cy="220" r="300" fill="#2563EB" fill-opacity="0.45" filter="url(#av3-blur)" />
  <circle cx="950" cy="350" r="340" fill="#0EA5E9" fill-opacity="0.38" filter="url(#av3-blur)" />
  <circle cx="650" cy="750" r="320" fill="#1E3A8A" fill-opacity="0.6" filter="url(#av3-blur)" />

  <!-- 3D Geometric Facets -->
  <g transform="translate(180, 160)">
    <polygon points="120,40 380,120 280,380 40,280" fill="url(#av3-facet)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" />
    <polygon points="380,120 540,240 440,480 280,380" fill="rgba(37, 99, 235, 0.3)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2" />
    <polygon points="40,280 280,380 180,540 0,460" fill="rgba(14, 165, 233, 0.25)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" />
  </g>

  <!-- Luminous floating dots and lines -->
  <line x1="100" y1="180" x2="1100" y2="180" stroke="rgba(56, 189, 248, 0.2)" stroke-dasharray="12 12" />
  <line x1="100" y1="720" x2="1100" y2="720" stroke="rgba(56, 189, 248, 0.2)" stroke-dasharray="12 12" />
</svg>

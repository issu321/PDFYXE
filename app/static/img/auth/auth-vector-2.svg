<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="av2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#1E3A8A" />
      <stop offset="80%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="av2-wave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#1D4ED8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="av2-wave2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.15" />
    </linearGradient>
    <filter id="av2-blur-deep" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#av2-bg)" />

  <circle cx="200" cy="200" r="320" fill="#2563EB" fill-opacity="0.4" filter="url(#av2-blur-deep)" />
  <circle cx="1000" cy="300" r="360" fill="#38BDF8" fill-opacity="0.35" filter="url(#av2-blur-deep)" />
  <circle cx="500" cy="800" r="340" fill="#1E40AF" fill-opacity="0.6" filter="url(#av2-blur-deep)" />

  <!-- Flowing Glass Waveforms -->
  <path d="M-80,450 C260,280 540,620 900,410 C1120,290 1200,480 1300,420 L1300,950 L-80,950 Z" fill="url(#av2-wave1)" />
  <path d="M-80,560 C320,440 680,690 980,520 C1180,410 1240,590 1300,530 L1300,950 L-80,950 Z" fill="url(#av2-wave2)" />

  <!-- Glass UI Plate Overlay -->
  <g transform="translate(160, 180)">
    <rect x="0" y="0" width="480" height="320" rx="32" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" />
    <line x1="40" y1="60" x2="220" y2="60" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="4" stroke-linecap="round" />
    <line x1="40" y1="90" x2="340" y2="90" stroke="rgba(255, 255, 255, 0.4)" stroke-width="3" stroke-linecap="round" />
    <line x1="40" y1="120" x2="280" y2="120" stroke="rgba(255, 255, 255, 0.4)" stroke-width="3" stroke-linecap="round" />
    
    <rect x="40" y="160" width="180" height="110" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" />
    <rect x="240" y="160" width="200" height="110" rx="16" fill="rgba(37, 99, 235, 0.2)" stroke="rgba(96, 165, 250, 0.35)" stroke-width="1.5" />
  </g>
</svg>

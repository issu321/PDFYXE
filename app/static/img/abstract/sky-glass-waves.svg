<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FCFF" />
      <stop offset="50%" stop-color="#F0F8FF" />
      <stop offset="100%" stop-color="#E6F4FE" />
    </linearGradient>
    <linearGradient id="wave-1" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="wave-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="wave-3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <filter id="blur-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <filter id="blur-deep" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-grad)" />

  <!-- Background luminous orbs -->
  <circle cx="280" cy="180" r="320" fill="#38BDF8" fill-opacity="0.15" filter="url(#blur-deep)" />
  <circle cx="1380" cy="320" r="380" fill="#7DD3FC" fill-opacity="0.20" filter="url(#blur-deep)" />
  <circle cx="920" cy="740" r="340" fill="#0EA5E9" fill-opacity="0.12" filter="url(#blur-deep)" />

  <!-- Flowing glass wave layers -->
  <path d="M-100,320 C320,180 640,460 1020,310 C1340,180 1520,380 1720,290 L1720,950 L-100,950 Z" fill="url(#wave-1)" filter="url(#blur-soft)" />
  <path d="M-100,480 C260,360 680,620 1100,430 C1420,280 1580,510 1720,440 L1720,950 L-100,950 Z" fill="url(#wave-2)" />
  <path d="M-100,620 C380,510 740,710 1180,560 C1460,450 1620,590 1720,540 L1720,950 L-100,950 Z" fill="url(#wave-3)" />

  <!-- Subtle translucent geometric glass accents -->
  <g opacity="0.45">
    <rect x="220" y="160" width="220" height="140" rx="24" fill="#FFFFFF" fill-opacity="0.35" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" transform="rotate(-8 220 160)" />
    <rect x="1240" y="240" width="260" height="160" rx="28" fill="#FFFFFF" fill-opacity="0.30" stroke="rgba(56, 189, 248, 0.30)" stroke-width="1.5" transform="rotate(12 1240 240)" />
  </g>
</svg>
